x-app-environment: &app-environment
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: playersaloons
  DB_USERNAME: playersaloons
  DB_PASSWORD: secret
  REDIS_HOST: redis
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  SESSION_DRIVER: redis

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: playersaloons-app
    container_name: playersaloons_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      <<: *app-environment
      SERVICE_TYPE: web
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - playersaloons_network

  nginx:
    image: nginx:alpine
    container_name: playersaloons_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-t", "1", "--spider", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - playersaloons_network

  mysql:
    image: mysql:8.0
    container_name: playersaloons_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: playersaloons
      MYSQL_USER: playersaloons
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - playersaloons_network

  redis:
    image: redis:alpine
    container_name: playersaloons_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - playersaloons_network

  worker:
    image: playersaloons-app
    container_name: playersaloons_worker
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      <<: *app-environment
      SERVICE_TYPE: worker
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - playersaloons_network

  scheduler:
    image: playersaloons-app
    container_name: playersaloons_scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      <<: *app-environment
      SERVICE_TYPE: scheduler
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - playersaloons_network

  reverb:
    image: playersaloons-app
    container_name: playersaloons_reverb
    restart: unless-stopped
    ports:
      - "8080:8080"
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      <<: *app-environment
      SERVICE_TYPE: reverb
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - playersaloons_network

  minio:
    image: minio/minio
    container_name: playersaloons_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - playersaloons_network

  mailpit:
    image: axllent/mailpit
    container_name: playersaloons_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - playersaloons_network

networks:
  playersaloons_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  minio_data:
