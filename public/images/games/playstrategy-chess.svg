<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Chess 3D Arena Card">
  <defs>
    <radialGradient id="bg-chess" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#112b49"/>
      <stop offset="48%" stop-color="#091628"/>
      <stop offset="100%" stop-color="#040914"/>
    </radialGradient>
    <radialGradient id="aura-cyan" cx="50%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#0ea5e9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura-lime" cx="62%" cy="28%" r="30%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="board-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="50%" stop-color="#0d1f36"/>
      <stop offset="100%" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="board-side-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2942"/>
      <stop offset="100%" stop-color="#06101d"/>
    </linearGradient>
    <linearGradient id="board-side-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#163c5e"/>
      <stop offset="100%" stop-color="#081728"/>
    </linearGradient>
    <linearGradient id="king-body" x1="15%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="18%" stop-color="#7dd3fc"/>
      <stop offset="46%" stop-color="#163454"/>
      <stop offset="80%" stop-color="#091728"/>
      <stop offset="100%" stop-color="#040b15"/>
    </linearGradient>
    <linearGradient id="king-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <linearGradient id="knight-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="28%" stop-color="#38bdf8"/>
      <stop offset="68%" stop-color="#102944"/>
      <stop offset="100%" stop-color="#061221"/>
    </linearGradient>
    <linearGradient id="bottom-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040914" stop-opacity="0"/>
      <stop offset="100%" stop-color="#040914" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="piece-shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#02060d" flood-opacity="0.78"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg-chess)"/>
  <ellipse cx="400" cy="430" rx="340" ry="280" fill="url(#aura-cyan)"/>
  <ellipse cx="510" cy="260" rx="220" ry="180" fill="url(#aura-lime)"/>

  <!-- Subtle architectural grid lines -->
  <g stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 180 H800 M0 340 H800 M0 500 H800 M0 660 H800"/>
    <path d="M160 0 V1000 M320 0 V1000 M480 0 V1000 M640 0 V1000"/>
  </g>

  <!-- 3D Isometric Chessboard Slab -->
  <g transform="translate(400, 560)">
    <!-- Ambient drop shadow -->
    <polygon points="0,195 -290,55 0,-85 290,55" fill="#01040a" opacity="0.65" filter="url(#glow-soft)"/>
    <!-- Left & Right thickness faces -->
    <polygon points="-275,20 0,158 0,192 -275,54" fill="url(#board-side-l)" stroke="#38bdf8" stroke-opacity="0.22"/>
    <polygon points="275,20 0,158 0,192 275,54" fill="url(#board-side-r)" stroke="#38bdf8" stroke-opacity="0.35"/>
    <!-- Top diamond -->
    <polygon points="0,-118 275,20 0,158 -275,20" fill="url(#board-top)" stroke="#7dd3fc" stroke-opacity="0.5" stroke-width="2"/>

    <!-- Isometric 4x4 highlighted center tiles -->
    <g opacity="0.92">
      <!-- Row 1 -->
      <polygon points="0,-96 60,-66 0,-36 -60,-66" fill="#38bdf8" fill-opacity="0.22" stroke="#7dd3fc" stroke-opacity="0.28"/>
      <polygon points="60,-66 120,-36 60,-6 0,-36" fill="#09182b" stroke="#38bdf8" stroke-opacity="0.16"/>
      <polygon points="-60,-66 0,-36 -60,-6 -120,-36" fill="#09182b" stroke="#38bdf8" stroke-opacity="0.16"/>
      <!-- Row 2 -->
      <polygon points="0,-36 60,-6 0,24 -60,-6" fill="#a3e635" fill-opacity="0.20" stroke="#bef264" stroke-opacity="0.48"/>
      <polygon points="120,-36 180,-6 120,24 60,-6" fill="#38bdf8" fill-opacity="0.18" stroke="#7dd3fc" stroke-opacity="0.25"/>
      <polygon points="-120,-36 -60,-6 -120,24 -180,-6" fill="#38bdf8" fill-opacity="0.18" stroke="#7dd3fc" stroke-opacity="0.25"/>
      <!-- Row 3 -->
      <polygon points="60,-6 120,24 60,54 0,24" fill="#38bdf8" fill-opacity="0.24" stroke="#7dd3fc" stroke-opacity="0.35"/>
      <polygon points="-60,-6 0,24 -60,54 -120,24" fill="#38bdf8" fill-opacity="0.24" stroke="#7dd3fc" stroke-opacity="0.35"/>
      <polygon points="0,24 60,54 0,84 -60,54" fill="#0b1d33" stroke="#38bdf8" stroke-opacity="0.22"/>
      <!-- Row 4 -->
      <polygon points="0,84 60,114 0,144 -60,114" fill="#38bdf8" fill-opacity="0.16" stroke="#7dd3fc" stroke-opacity="0.28"/>
    </g>
    <!-- Glowing edge rim -->
    <polyline points="-275,20 0,158 275,20" fill="none" stroke="url(#king-rim)" stroke-width="2.5" stroke-opacity="0.8"/>
  </g>

  <!-- Secondary 3D Chess Knight (Right Back) -->
  <g transform="translate(525, 425)" filter="url(#piece-shadow)">
    <ellipse cx="0" cy="112" rx="68" ry="26" fill="#030914" opacity="0.72"/>
    <!-- Base pedestal -->
    <ellipse cx="0" cy="96" rx="54" ry="20" fill="#081628" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.5"/>
    <path d="M-46,84 C-46,66 46,66 46,84 L52,96 C52,110 -52,110 -52,96 Z" fill="url(#knight-body)"/>
    <ellipse cx="0" cy="76" rx="40" ry="13" fill="#0d233d" stroke="#7dd3fc" stroke-opacity="0.5"/>
    <!-- Sculpted geometric 3D Knight head -->
    <path d="M-30,72 C-34,32 -26,-16 -4,-44 L-12,-66 L12,-52 C34,-44 48,-24 52,0 L34,12 L10,2 C22,22 28,46 32,72 Z" fill="url(#knight-body)" stroke="url(#king-rim)" stroke-width="2" stroke-linejoin="round"/>
    <!-- Specular facet highlight -->
    <path d="M-12,-44 C-2,-28 6,-16 4,4 L-16,18 C-20,-6 -18,-26 -12,-44 Z" fill="#e0f2fe" fill-opacity="0.22"/>
    <circle cx="20" cy="-22" r="4.5" fill="#bef264"/>
  </g>

  <!-- Hero 3D Chess King (Center Left Foreground) -->
  <g transform="translate(362, 378)" filter="url(#piece-shadow)">
    <!-- Ground glow ring -->
    <ellipse cx="0" cy="166" rx="92" ry="34" fill="#38bdf8" fill-opacity="0.16" filter="url(#glow-soft)"/>
    <!-- Base Tier 1 -->
    <path d="M-74,142 C-74,118 74,118 74,142 L80,162 C80,186 -80,186 -80,162 Z" fill="url(#king-body)" stroke="#7dd3fc" stroke-opacity="0.65" stroke-width="2"/>
    <ellipse cx="0" cy="138" rx="68" ry="22" fill="#102a47" stroke="#bae6fd" stroke-opacity="0.55" stroke-width="1.5"/>
    <!-- Base Tier 2 -->
    <path d="M-54,116 C-54,98 54,98 54,116 L60,136 C60,152 -60,152 -60,136 Z" fill="url(#king-body)" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5"/>
    <!-- Tapered Stem -->
    <path d="M-34,-26 C-28,30 -38,76 -52,114 C-32,126 32,126 52,114 C38,76 28,30 34,-26 Z" fill="url(#king-body)" stroke="url(#king-rim)" stroke-width="2"/>
    <!-- Collar Ring -->
    <ellipse cx="0" cy="-24" rx="46" ry="15" fill="#163b63" stroke="#bae6fd" stroke-width="2"/>
    <ellipse cx="0" cy="-32" rx="38" ry="12" fill="#0d233d" stroke="#a3e635" stroke-opacity="0.7" stroke-width="1.5"/>
    <!-- Crown Head -->
    <path d="M-36,-34 L-52,-106 C-28,-122 28,-122 52,-106 L36,-34 C18,-26 -18,-26 -36,-34 Z" fill="url(#king-body)" stroke="url(#king-rim)" stroke-width="2.2"/>
    <ellipse cx="0" cy="-106" rx="52" ry="16" fill="#123154" stroke="#e0f2fe" stroke-opacity="0.7" stroke-width="1.8"/>
    <!-- Vertical specular glass sheen -->
    <path d="M-24,-96 L-12,-96 L-18,108 L-34,104 Z" fill="#ffffff" fill-opacity="0.18"/>
    <!-- Glowing 3D Cross Finial -->
    <g filter="url(#glow-soft)">
      <rect x="-9" y="-176" width="18" height="68" rx="6" fill="url(#king-rim)"/>
      <rect x="-32" y="-154" width="64" height="17" rx="6" fill="url(#king-rim)"/>
    </g>
    <rect x="-7" y="-174" width="14" height="64" rx="5" fill="#f0f9ff" fill-opacity="0.72"/>
    <rect x="-30" y="-152" width="60" height="13" rx="5" fill="#f0f9ff" fill-opacity="0.72"/>
  </g>

  <!-- Floating neon accent sparks -->
  <circle cx="215" cy="230" r="4" fill="#38bdf8" opacity="0.7"/>
  <circle cx="610" cy="255" r="3" fill="#a3e635" opacity="0.8"/>
  <circle cx="170" cy="460" r="2.5" fill="#7dd3fc" opacity="0.6"/>
  <circle cx="645" cy="470" r="3.5" fill="#38bdf8" opacity="0.5"/>

  <!-- Clean dark gradient fade at bottom for card title readability -->
  <rect x="0" y="650" width="800" height="350" fill="url(#bottom-fade)"/>
</svg>
